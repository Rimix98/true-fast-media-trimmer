name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exe:
    name: Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Сборка .exe
        shell: pwsh
        run: |
          $env:MEDIA_TRIMMER_ONEFILE = "1"
          pyinstaller --noconfirm --clean packaging/media_trimmer.spec

      - name: Имя артефакта с версией
        shell: pwsh
        run: |
          $ver = (Get-Content version.txt -Raw).Trim()
          Move-Item dist/MediaTrimmer.exe "dist/MediaTrimmer-$ver-win64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: MediaTrimmer-windows-exe
          path: dist/MediaTrimmer-*-win64.exe
          if-no-files-found: error

  appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка системных зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools file curl

      - name: Установка зависимостей Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Сборка AppImage
        run: bash packaging/build_appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MediaTrimmer-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [exe, appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la artifacts/
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Медиа Обрезчик $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
